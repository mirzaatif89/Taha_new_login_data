<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Report</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-section="attendance">
    <header class="masthead">
      <div class="brand">
        <div class="brand__logo">TAHA</div>
        <div class="brand__text">
          <span>Clients Attendance</span>
          <small>Stored login and report history</small>
        </div>
      </div>
      <a class="btn ghost" href="report.html">Back</a>
    </header>

    <main class="page report-page">
      <section class="panel">
        <article class="card">
          <header>
            <h2>Clients Attendance</h2>
            <p id="detail-meta">Attendance snapshots captured from the portal.</p>
          </header>
          <div class="detail-search">
            <input
              id="detail-search-input"
              type="text"
              placeholder="Search username"
              aria-label="Search attendance"
            />
            <button id="detail-search-btn" class="btn ghost" type="button">Search</button>
            <button id="detail-delete-selected" class="btn ghost" type="button">Delete Selected</button>
          </div>
          <div class="table-wrap">
            <table class="data-table" id="detail-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="status" id="detail-status">Loading...</div>
        </article>
      </section>
    </main>

    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>

    <script src="report_detail.js"></script>
  </body>
</html>
