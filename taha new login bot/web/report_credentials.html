<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credentials Report</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-section="credentials">
    <header class="masthead">
      <a class="brand brand-link" href="index.html" aria-label="Go to dashboard">
        <div class="brand__logo">TAHA</div>
        <div class="brand__text">
          <span>Credentials</span>
          <small>Stored login and report history</small>
        </div>
      </a>
      <div class="masthead__actions">
        <button id="refresh-btn" class="btn ghost small" type="button">Refresh</button>
      </div>
    </header>

    <main class="page report-page">
      <section class="panel">
        <article class="card">
          <header>
            <h2>Credentials</h2>
            <p id="detail-meta">Latest credentials saved from uploads.</p>
          </header>
          <div class="detail-search">
            <input
              id="detail-search-input"
              type="text"
              placeholder="Search username"
              aria-label="Search credentials"
            />
            <button id="detail-search-btn" class="btn ghost" type="button">Search</button>
            <button id="detail-delete-selected" class="btn ghost" type="button">Delete Selected</button>
          </div>
          <div class="table-wrap">
            <table class="data-table" id="detail-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="status" id="detail-status">Loading...</div>
        </article>
      </section>
    </main>

    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>

    <div class="nav-arrows" aria-label="Page navigation">
      <button class="nav-arrow" type="button" data-nav="back" aria-label="Go back">&lt;</button>
      <button class="nav-arrow" type="button" data-nav="forward" aria-label="Go forward">&gt;</button>
    </div>

    <script src="theme.js"></script>
    <script src="nav.js"></script>
    <script src="refresh.js"></script>
    <script src="report_detail.js"></script>
  </body>
</html>
