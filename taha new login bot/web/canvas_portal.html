<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-portal="canvas">
    <header class="masthead">
      <a class="brand brand-link" href="index.html" aria-label="Go to dashboard">
        <div class="brand__logo">TAHA</div>
        <div class="brand__text">
          <span>Canvas</span>
          <small>Canvas workspace</small>
        </div>
      </a>
      <div class="masthead__actions">
        <button id="refresh-btn" class="btn ghost small" type="button">Refresh</button>
      </div>
    </header>

    <main class="page">
      <section class="panel grid-2">
        <article class="card">
          <header>
            <h2>Select Portal</h2>
            <p>Choose the portal before starting the upload.</p>
          </header>
          <div class="field">
            <label class="toggle">
              <input id="portal-canvas" type="radio" name="portal-select" checked />
              <span>Canvas Portal</span>
            </label>
            <label class="toggle">
              <input id="portal-connect" type="radio" name="portal-select" />
              <span>Connect Portal</span>
            </label>
          </div>
        </article>
      </section>
    </main>

    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>

    <div class="nav-arrows" aria-label="Page navigation">
      <button class="nav-arrow" type="button" data-nav="back" aria-label="Go back">&lt;</button>
      <button class="nav-arrow" type="button" data-nav="forward" aria-label="Go forward">&gt;</button>
    </div>

    <script src="theme.js"></script>
    <script src="nav.js"></script>
    <script src="refresh.js"></script>
    <script>
      const portalConnect = document.getElementById("portal-connect");
      if (portalConnect) {
        portalConnect.addEventListener("change", () => {
          if (!portalConnect.checked) return;
          try {
            localStorage.setItem("taha-portal", "connect");
          } catch (error) {
            // Ignore storage failures.
          }
          window.location.href = "index.html";
        });
      }
    </script>
  </body>
</html>
